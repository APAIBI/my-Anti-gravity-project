name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Publish Failure Logs to Summary
        if: failure()
        run: |
          echo "### ⚠️ Build Failure Logs" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Prepare Version 2 APK File
        run: |
          echo "Copying built APK to root as TalkBack-Avatar-v2.apk:"
          cp app/build/outputs/apk/debug/app-debug.apk TalkBack-Avatar-v2.apk
          ls -lh TalkBack-Avatar-v2.apk

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TalkBack-Avatar-v2-apk
          path: TalkBack-Avatar-v2.apk
          retention-days: 14

      - name: Publish Version 2 Release with Direct APK
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v2.0
          name: "TalkBack Avatar App Version 2"
          body: "Direct download of TalkBack-Avatar-v2.apk. Includes all 4 animated avatars (Cat, Husky, Sakura, Elena) and functional TalkBack speech revoicing."
          files: TalkBack-Avatar-v2.apk
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

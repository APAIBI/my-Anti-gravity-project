name: Build Android APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: |
          ./gradlew assembleDebug --stacktrace --no-daemon 2>&1 | tee build.log

      - name: Publish Failure Logs to Summary
        if: failure()
        run: |
          echo "### ⚠️ Build Failure Logs" >> $GITHUB_STEP_SUMMARY
          echo '```text' >> $GITHUB_STEP_SUMMARY
          tail -n 150 build.log >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: talkback-avatar-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14

      - name: Publish Direct APK to GitHub Releases
        if: github.ref == 'refs/heads/main'
        run: |
          echo "Verifying compiled APK:"
          ls -lh app/build/outputs/apk/debug/app-debug.apk
          echo "Uploading APK asset to release v1.0.0:"
          gh release upload v1.0.0 app/build/outputs/apk/debug/app-debug.apk --clobber || \
          gh release create v1.0.0 app/build/outputs/apk/debug/app-debug.apk \
            --title "TalkBack Avatar App v1.0.0" \
            --notes "Direct unzipped download for app-debug.apk. Includes all 4 avatars (Cat, Husky, Sakura, Elena) and working TalkBack speech revoicing."
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
